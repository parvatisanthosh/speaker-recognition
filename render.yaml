services:
  - type: web
    name: dhwani-speaker-recognition
    runtime: python
    pythonVersion: 3.11.9
    buildCommand: |
      apt-get update
      apt-get install -y libsndfile1 ffmpeg
      pip install -r requirements.txt
    startCommand: gunicorn speaker_recognition_server:app
    envVars:
      - key: PYANNOTE_AUTH_TOKEN
        sync: false
